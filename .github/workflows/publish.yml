name: Build Python package (and upload to PyPI on tags)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"
          package-manager-cache: false
      - run: cd frontend && npm ci
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - run: uv build
      - run: uv run --no-dev pybabel extract --omit-header --mapping-file=pyproject.toml --output-file=src/fava/translations/messages.pot .
      - run: git diff --exit-code
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error
      - name: Publish release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          UV_PUBLISH_USERNAME: __token__
          UV_PUBLISH_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: uv publish
  nightly:
    runs-on: ubuntu-latest
    if: github.repository == 'beancount/fava' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: "build-and-publish"
    permissions:
      contents: write
    concurrency:
      group: "nightly"
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel
          path: dist
      - name: Replace nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly dist/*.whl --prerelease --target "$GITHUB_SHA" \
            --title "Nightly" --notes "Latest build from main ($GITHUB_SHA)."
